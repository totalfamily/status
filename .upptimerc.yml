owner: totalfamily
repo: status

sites:
  - name: Web Application
    url: https://app.totalfamily.io/api/health
    icon: https://help.totalfamily.io/img/tf-logo-dark.webp
    maxResponseTime: 1500
    # Health endpoint returns 200 with "status":"unhealthy" when the database
    # check fails, so a status-code check alone would miss a DB outage.
    __dangerous__body_down_if_text_missing: '"status":"healthy"'
  - name: Website
    url: https://totalfamily.io
    maxResponseTime: 1000
  - name: Help Center
    url: https://help.totalfamily.io
    maxResponseTime: 2500

# Auto-assign downtime issues so a human gets pinged on a real outage
assignees:
  - 1andonlyamit

# Keep the README ours: don't re-add the "Powered by" promo line, and don't
# overwrite the repo description we set by hand.
skipPoweredByReadme: true
skipDescriptionUpdate: true
skipTopicsUpdate: true

# Commits from the monitor should read as ours, not a third party's
commitMessages:
  commitAuthorName: Total Family Status Bot
  commitAuthorEmail: hello@totalfamily.io

status-website:
  # Temporarily serving from https://totalfamily.github.io/status to verify the
  # page renders before pointing DNS at it. Restore `cname` and remove `baseUrl`
  # to go live on the custom domain.
  # cname: status.totalfamily.io
  baseUrl: /status
  logoUrl: https://help.totalfamily.io/img/tf-logo-dark.webp
  name: Total Family Status
  introTitle: "Total Family System Status"
  introMessage: Live availability and incident history for Total Family services.
  navbar:
    - title: Status
      href: /
    - title: Help Center
      href: https://help.totalfamily.io
    - title: Website
      href: https://totalfamily.io
